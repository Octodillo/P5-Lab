<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P5 Lab | Aria Dotzler</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "p5": "https://esm.sh/p5@1.7.0",
          "events": "https://esm.sh/jsr/@denosaurs/event"
        }
      }
    </script>
    <script defer type="module" src="/src/init.ts"></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Column 1: Sketch List -->
      <aside class="sketch-list">
        <div class="sketch-list__header">
          <h2>Sketches</h2>
        </div>
        <div id="sketches-container" class="sketch-list__items">
          <div class="loading">Loading...</div>
        </div>
      </aside>

      <!-- Column 2: Controls -->
      <aside class="controls-panel">
        <div class="controls-panel__header">
          <h2>Controls</h2>
        </div>
        <div id="controls-container" class="controls-panel__content">
          <div class="controls-empty">Select a sketch to view controls</div>
        </div>
        <div id="global-controls-container" class="controls-panel__global">
          <div class="sketch-controls sketch-controls--global">
            <div class="sketch-controls__row">
              <button class="sketch-controls__button">Reset</button>
              <button class="sketch-controls__button">Stop</button>
              <button class="sketch-controls__button">Step</button>
              <button class="sketch-controls__button">Play</button>
            </div>
            <div class="sketch-controls__row">
              <span class="sketch-controls__slider-label">Target FPS</span>
              <input type="number" min="1" max="1000" class="sketch-controls__input" />
            </div>
            <span class="sketch-controls__stat">Current: --</span>
          </div>
        </div>
      </aside>

      <!-- Column 3: Sketch Canvas -->
      <main class="sketch-viewport">
        <div id="sketch-container" class="sketch-viewport__canvas"></div>
      </main>
    </div>
  </body>
</html>
