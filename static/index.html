<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js TypeScript Playground</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "p5": "https://esm.sh/p5@1.7.0",
          "events": "https://esm.sh/jsr/@denosaurs/event"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Column 1: Sketch List -->
      <aside class="sketch-list">
        <div class="sketch-list__header">
          <h2>Sketches</h2>
        </div>
        <div id="sketches-container" class="sketch-list__items">
          <div class="loading">Loading...</div>
        </div>
      </aside>

      <!-- Column 2: Controls -->
      <aside class="controls-panel">
        <div class="controls-panel__header">
          <h2>Controls</h2>
        </div>
        <div id="controls-container" class="controls-panel__content">
          <div class="controls-empty">Select a sketch to view controls</div>
        </div>
        <div id="global-controls-container" class="controls-panel__global"></div>
      </aside>

      <!-- Column 3: Sketch Canvas -->
      <main class="sketch-viewport">
        <div id="sketch-container" class="sketch-viewport__canvas"></div>
      </main>
    </div>

    <script type="module" src="/static/index.js"></script>
    <script src="/static/live-reload.js"></script>
  </body>
</html>
